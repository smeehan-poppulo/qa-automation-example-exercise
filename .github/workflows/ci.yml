name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-progress CI runs for the same branch on new pushes.
# Pages deployments use their own concurrency group (cancel-in-progress: false)
# to avoid tearing down a deployment mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test:
    name: Playwright Tests
    needs: check
    runs-on: ubuntu-latest
    # Browsers and all OS-level dependencies are pre-installed in the image.
    # Update the tag whenever @playwright/test is bumped in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On pull requests run the smoke suite for fast feedback.
      # On push to main (and manual triggers) run the full regression suite.
      - name: Run smoke tests
        if: github.event_name == 'pull_request'
        run: npm run test:smoke
        env:
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}

      - name: Run regression tests
        if: github.event_name != 'pull_request'
        run: npm run test:regression
        env:
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}

      # PRs: upload as a regular artifact (forks cannot deploy to Pages)
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'pull_request'
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      # Push to main / manual dispatch: package for GitHub Pages deployment
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        if: always() && github.event_name != 'pull_request'
        with:
          path: playwright-report/

      - name: Upload test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy Report to GitHub Pages
    needs: test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
